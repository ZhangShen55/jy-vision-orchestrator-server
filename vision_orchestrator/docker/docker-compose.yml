services:
  redis:
    image: redis:7-alpine
    container_name: vision-orchestrator-redis
    ports:
      - "6379:6379"

  vision-orchestrator-api:
    build:
      context: ../..
      dockerfile: vision_orchestrator/docker/Dockerfile
    container_name: vision-orchestrator-api
    command: python -m vision_orchestrator.app --config /workspace/vision_orchestrator/config.toml serve
    environment:
      CONFIG_PATH: /workspace/vision_orchestrator/config.toml
    ports:
      - "9000:9000"
    volumes:
      - ../config.toml:/workspace/vision_orchestrator/config.toml:ro
      - ../../mnt:/mnt
    depends_on:
      - redis

  vision-orchestrator-worker:
    build:
      context: ../..
      dockerfile: vision_orchestrator/docker/Dockerfile
    container_name: vision-orchestrator-worker
    command: python -m vision_orchestrator.app --config /workspace/vision_orchestrator/config.toml worker
    environment:
      CONFIG_PATH: /workspace/vision_orchestrator/config.toml
      VISION_ORCHESTRATOR_WORKER_ID: worker-compose-1
    volumes:
      - ../config.toml:/workspace/vision_orchestrator/config.toml:ro
      - ../../mnt:/mnt
    depends_on:
      - redis
      - vision-orchestrator-api

networks:
  default:
    name: vision-orchestrator-net
